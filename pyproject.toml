[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "localgen"
version = "1.0.0"
description = "Local, single-image generation for Windows"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn==0.42.0",
  "mcp==1.26.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pillow==12.2.0",
  "python-multipart==0.0.33",
  "websockets==16.0",
  "psutil==7.2.2",
  "PySide6==6.10.2",
  "pywin32==311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pyinstaller==6.19.0"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.toml" = "localgen/resources/config/default.toml"
"workflows" = "localgen/resources/workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
